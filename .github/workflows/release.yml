name: Release

# Publish to PyPI when a version tag is pushed (e.g. `git tag 0.3.0 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored anywhere.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/layeredcompmodel/
    permissions:
      id-token: write   # REQUIRED for Trusted Publishing; grants nothing else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          PKG_VER=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$PKG_VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '$PKG_VER'. Bump both, or tag the right commit."
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
